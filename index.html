<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>GameSeeker · Descubra seu próximo jogo</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rubik:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <script>
      try {
        var t =
          localStorage.getItem("zp_theme") ||
          (matchMedia("(prefers-color-scheme: light)").matches
            ? "light"
            : "dark");
        document.documentElement.dataset.theme = t;
      } catch (e) {
        document.documentElement.dataset.theme = "dark";
      }
    </script>
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <div class="app">
      <aside class="side">
        <a class="brand" href="./" aria-label="GameSeeker, ir para o início">
          <h1 class="logo">GAME<br />SEEKER</h1>
        </a>
        <nav class="nav" aria-label="Navegação principal">
          <button
            id="nav-home"
            class="nav-item"
            type="button"
            aria-current="true"
          >
            <span aria-hidden="true">🏠</span> Início
          </button>
          <button
            id="nav-fav"
            class="nav-item"
            type="button"
            aria-current="false"
          >
            <span aria-hidden="true">💜</span> Favoritos
          </button>
          <a class="nav-item" href="#chips">
            <span aria-hidden="true">▦</span> Categorias
          </a>
          <a class="nav-item" href="#sobre">
            <span aria-hidden="true">ℹ️</span> Sobre
          </a>
        </nav>
      </aside>

      <div class="content">
        <header>
          <p class="sub">Ache seu próximo jogo em segundos</p>
        </header>
        <div class="bar">
          <div class="bar-in">
            <div class="row">
              <div class="search">
                <span class="search-ic" aria-hidden="true">🔍</span>
                <input
                  id="q"
                  type="search"
                  placeholder="Buscar jogos, gêneros ou plataformas…"
                  aria-label="Buscar jogos"
                />
              </div>
              <select id="pf" aria-label="Filtrar por plataforma">
                <option value="">Todas as plataformas</option>
              </select>
              <select id="sort" aria-label="Ordenar jogos">
                <option value="">Ordem padrão</option>
                <option value="nome">Nome (A-Z)</option>
                <option value="novos">Mais recentes</option>
                <option value="antigos">Mais antigos</option>
              </select>
              <button id="clear" class="chip" type="button" hidden>
                Limpar filtros
              </button>
              <button
                id="theme"
                class="icon-btn"
                type="button"
                aria-label="Alternar tema"
              >
                🌙
              </button>
            </div>
          </div>
        </div>
        <main>
          <section
            class="hero"
            aria-roledescription="carousel"
            aria-label="Destaques"
          >
            <button
              id="hero-prev"
              class="hero-arrow"
              type="button"
              aria-label="Slide anterior"
            >
              ‹
            </button>
            <div class="hero-body">
              <p class="hero-kicker">GAME SEEKER</p>
              <h2 id="hero-title" class="hero-title"></h2>
              <p id="hero-text" class="hero-text"></p>
              <a class="hero-cta" href="#chips">▶ Explorar agora →</a>
            </div>
            <button
              id="hero-next"
              class="hero-arrow"
              type="button"
              aria-label="Próximo slide"
            >
              ›
            </button>
            <div
              id="hero-dots"
              class="hero-dots"
              role="group"
              aria-label="Escolher slide"
            ></div>
          </section>
          <section class="filters" aria-labelledby="filters-title">
            <div class="filters-head">
              <h2 id="filters-title">▼ Filtros rápidos</h2>
              <button id="random" class="chip" type="button">
                🎲 Surpreenda-me ✨
              </button>
            </div>
            <div
              class="chips"
              id="chips"
              role="group"
              aria-label="Filtrar por gênero"
            ></div>
          </section>
          <section id="featured" class="featured" aria-labelledby="feat-title">
            <div class="section-head">
              <h2 id="feat-title" class="section-title">
                ⭐ Jogos em destaque
              </h2>
              <a id="see-all" class="link-btn" href="#all">Ver todos →</a>
            </div>
            <div id="feat-row" class="row-scroll"></div>
          </section>

          <div id="all" class="section-head">
            <h2 class="section-title">📚 Todos os jogos</h2>
          </div>
          <p class="count" id="count" aria-live="polite"></p>
          <div class="grid" id="grid"></div>
        </main>
        <footer id="sobre">
          GameSeeker · feito para descobrir seu próximo jogo
        </footer>
      </div>
    </div>
    <dialog id="dlg">
      <div id="dc"></div>
    </dialog>
    <script src="script.js"></script>
  </body>
</html>
